name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Backend the CI builds point at. Real deployments override this with a repository variable.
  API_BASE_URL: ${{ vars.API_BASE_URL || 'http://10.0.2.2:8080' }}

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  build-android:
    name: Build Android (debug APK)
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate & patch the Android project
        run: bash scripts/setup_platforms.sh android
        env:
          CLEARTEXT: "1"        # CI builds are debug builds that talk to a local http:// backend

      - run: flutter pub get

      - name: Build debug APK
        run: >
          flutter build apk --debug
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=KAKAO_JS_KEY=${{ secrets.KAKAO_JS_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios:
    name: Build iOS (no codesign)
    needs: analyze-test
    # macOS minutes are 10x more expensive: only on main and manual runs, not on every PR.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate & patch the iOS project
        run: bash scripts/setup_platforms.sh ios
        env:
          CLEARTEXT: "1"

      - run: flutter pub get

      - name: Build iOS without code signing
        run: >
          flutter build ios --debug --no-codesign
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=KAKAO_JS_KEY=${{ secrets.KAKAO_JS_KEY }}
